[project]
name = "commitfolio"
version = "0.1.0"
description = "GitHub 커밋을 분석해 이력서·회고·포트폴리오 문장을 만드는 백엔드"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.30.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
commitfolio = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
